<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marketing Fund Leaderboard</title>
<style>
  :root{--blue:#1C96D3;--ink:#fff;--muted:rgba(255,255,255,.55);--track:rgba(255,255,255,.08);--bg:#28353A}
  html,body{height:100%}
  body{margin:0;background:var(--bg);display:flex;align-items:center;justify-content:center}
  .mfl{box-sizing:border-box;width:100%;aspect-ratio:1/1;background:var(--bg);color:var(--ink);
    font:14px/1.2 'proxima-nova','Proxima Nova','Segoe UI',Helvetica,Arial,sans-serif;padding:14px 0 10px;
    display:flex;flex-direction:column;overflow:hidden}
  .mfl *{box-sizing:border-box}
  .mfl h2{margin:0;font-size:20px;font-weight:600;text-transform:uppercase;color:var(--ink)}
  .mfl p{margin:4px 0 12px;font-size:11px;color:var(--muted)}
  .mfl ol{list-style:none;margin:0;padding:0;flex:1;display:flex;flex-direction:column;justify-content:space-between}
  .mfl li{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto 5px;gap:0 8px;align-items:center}
  .mfl .name{font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mfl .up{font-size:10px;font-weight:700;color:var(--blue);margin-right:8px;white-space:nowrap}
  .mfl .pct{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;font-size:13px}
  .mfl .bar{grid-column:1/3;height:5px;background:var(--track);border-radius:3px;overflow:hidden}
  .mfl .bar i{display:block;height:100%;width:var(--w);background:var(--blue);border-radius:3px;
    animation:mfl-grow .9s cubic-bezier(.2,.8,.2,1) both}
  .mfl .total{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;padding-top:8px;
    border-top:1px solid rgba(255,255,255,.15);font-size:11px;color:var(--muted)}
  .mfl .total b{font-size:13px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
  @keyframes mfl-grow{from{width:0}}
  @media (prefers-reduced-motion:reduce){.mfl .bar i{animation:none}}
</style>
</head>
<body>
<div class="mfl">
  <h2>Live tracker: Marketing Fund</h2>
  <p># of caves in the fund by region (so far)</p>
  <ol id="mfl-rows"></ol>
  <div class="total"><span>Total across AU</span><b>69%</b></div>
</div>
<script>
  // Edit here. Shown in this order. [name, now, at last update] - an arrow shows when now > last.
  const data = [
    ["SEQ", 76, 76],
    ["Sydney", 74, 74],
    ["NSW North", 75, 75],
    ["VIC TAS", 40, 40],
    ["QLD/NT Regional", 50, 50],
    ["NSW South ACT", 25, 25],
  ];
  document.getElementById("mfl-rows").innerHTML = data
    .map(([name, pct, prev], i) =>
      `<li><span class="name">${name}</span><span class="pct">${pct > prev ? `<span class="up">&#9650; +${pct - prev}</span>` : ""}${pct}%</span>` +
      `<span class="bar"><i style="--w:${pct}%;animation-delay:${i * 80}ms"></i></span></li>`)
    .join("");
</script>
</body>
</html>
